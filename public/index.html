<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>GRaPHeNe · Graphing Calculator</title>
        <link rel="icon" href="/favicon-xermore.svg" type="image/svg+xml">
        <meta name="theme-color" content="#FAF9F6">
        <meta name="webmcp" content="disable">
        <meta http-equiv="Permissions-Policy" content="model-context=()">
        <link rel="stylesheet" href="/style.css">
        <script>try{
          const stub={getModelContext:()=>({}),createModelContext:()=>({}),available:true,enabled:false};
          if(!('modelContext' in document)) Object.defineProperty(document,'modelContext',{value:stub,writable:true,configurable:true}); else try{ document.modelContext={...document.modelContext, ...stub}; }catch(e){}
          if(!('modelContext' in window)) window.modelContext=stub;
          if(!('modelContext' in navigator)) try{ Object.defineProperty(navigator,'modelContext',{value:stub,writable:true,configurable:true}); }catch(e){ navigator.modelContext=stub; }
          window.__webmcpDisabled=true;
        }catch(e){}</script>
        <script>(function(){try{var t=localStorage.getItem("xm-theme");var d=t?t==="dark":window.matchMedia("(prefers-color-scheme: dark)").matches;if(d)document.documentElement.classList.add("dark")}catch(e){}})();</script>
    </head>
    <body>
        <div id="app">
            <header id="brand">
                <div class="brand-left">
                    <span class="logo" aria-hidden="true">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 17c3.5 0 4-11 7-11s3.5 8 6 8c2 0 2.5-3 5-3"/></svg>
                    </span>
                    <h1>GRaPHe<span class="accent">Ne</span></h1>
                </div>
                <div class="brand-right">
                    <a id="source-link" href="https://github.com/xenod799/graphehe" target="_blank" rel="noopener">Source</a>
                    <button id="theme-toggle" type="button" aria-label="Toggle dark mode">
                        <svg class="sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.3 11.3 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                        <svg class="moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
                    </button>
                </div>
            </header>

            <div id="main">
                <aside id="sidebar">
                    <section class="panel" id="equations-panel">
                        <h2>Equations</h2>
                        <div id="eq-list"></div>
                        <button type="button" id="add-eq" class="ghost-btn">
                            <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                            Add equation
                        </button>
                        <div class="examples" aria-label="Example equations">
                            <span class="examples-label">Try:</span>
                            <button type="button" class="chip" data-eq="sin(x)">sin(x)</button>
                            <button type="button" class="chip" data-eq="x^2">x^2</button>
                            <button type="button" class="chip" data-eq="x^2 + y^2 = 25">circle</button>
                            <button type="button" class="chip" data-eq="sin(x)*exp(-abs(x)/3)">decay</button>
                            <button type="button" class="chip" data-eq="tan(x)">tan(x)</button>
                        </div>
                        <div id="live-indicator" aria-live="polite">
                            <span class="live-dot"></span>
                            <span class="live-text">Live</span>
                            <span class="live-spinner" aria-hidden="true"></span>
                        </div>
                    </section>

                    <details class="panel" id="bounds" open>
                        <summary>Bounds</summary>
                        <div class="bound-grid">
                            <div class="bound-row">
                                <label for="xmin">X<sub>min</sub></label>
                                <input type="number" id="xmin" value="-10" step="1">
                            </div>
                            <div class="bound-row">
                                <label for="xmax">X<sub>max</sub></label>
                                <input type="number" id="xmax" value="10" step="1">
                            </div>
                            <div class="bound-row">
                                <label for="ymin">Y<sub>min</sub></label>
                                <input type="number" id="ymin" value="-7.5" step="0.5">
                            </div>
                            <div class="bound-row">
                                <label for="ymax">Y<sub>max</sub></label>
                                <input type="number" id="ymax" value="7.5" step="0.5">
                            </div>
                        </div>
                        <button type="button" id="reset-bounds" class="ghost-btn small">Reset view</button>
                    </details>
                </aside>

                <main id="viewport">
                    <div id="placeholder">
                        <div class="ph-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 17c3.5 0 4-11 7-11s3.5 8 6 8c2 0 2.5-3 5-3"/></svg>
                        </div>
                        <p>Type an equation — graph updates live</p>
                        <p class="ph-sub">e.g. sin(x) · x^2 · x^2 + y^2 = 25</p>
                    </div>
                    <canvas id="graph-canvas" aria-label="Graph"></canvas>
                    <div id="toolbar" aria-label="Graph controls">
                        <button type="button" id="zoom-in" title="Zoom in"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M11 8v6M8 11h6"/></svg></button>
                        <button type="button" id="zoom-out" title="Zoom out"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M8 11h6"/></svg></button>
                        <button type="button" id="reset-view" title="Reset view"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 9V3h6M21 9V3h-6M3 15v6h6M21 15v6h-6"/></svg></button>
                        <button type="button" id="download" title="Download PNG"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 19h16"/></svg></button>
                        <button type="button" id="share" title="Copy link"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 14a5 5 0 0 0 7.5.5l2-2a5 5 0 0 0-7-7l-1 1"/><path d="M14 10a5 5 0 0 0-7.5-.5l-2 2a5 5 0 0 0 7 7l1-1"/></svg></button>
                    </div>
                    <div id="status-chip" role="status"></div>
                </main>
            </div>
        </div>
        <div id="toast-stack" aria-live="polite"></div>
        <script src="/vendor/math.js"></script>
        <script src="/graph-render.js"></script>
        <script src="/app.js"></script>
        <script>
          document.getElementById("theme-toggle")?.addEventListener("click", function(){
            var r=document.documentElement; r.classList.toggle("dark");
            try{localStorage.setItem("xm-theme", r.classList.contains("dark")?"dark":"light")}catch(e){}
          });
        </script>
    </body>
</html>
